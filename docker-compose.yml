services:
  bank_simulator:
    container_name: bank_simulator
    image: bbyars/mountebank:2.8.1
    ports:
      - "2525:2525"
      - "8080:8080"
    command: --configfile /imposters/bank_simulator.ejs --allowInjection
    volumes:
      - type: bind
        source: ./imposters
        target: /imposters
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:2525/ > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - payment_network

  payment_gateway:
    container_name: payment_gateway
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - BankApi__BaseUrl=http://bank_simulator:8080
    depends_on:
      bank_simulator:
        condition: service_healthy
    networks:
      - payment_network

networks:
  payment_network:
    driver: bridge
